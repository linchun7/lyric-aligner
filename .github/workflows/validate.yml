name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q lyric_aligner scripts
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p "test_*.py" 2>&1 | tee "unittest-${{ matrix.python-version }}.log"
      - name: Upload unittest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-python-${{ matrix.python-version }}
          path: unittest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7
      - run: python scripts/validate_skill.py .
      - run: python scripts/privacy_scan.py
      - run: python scripts/check_environment.py
      - run: git diff --check

  asr-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-asr.txt
      - run: python scripts/check_environment.py --asr