          text = bpm_path.read_text(encoding='utf-8')

          text = text.replace(
              'from lyric_aligner.text_repair import MatchDecision, SubtitleCue, _normalize_for_match',
              'from lyric_aligner.text_repair import (\n'
              '    MatchDecision,\n'
              '    SubtitleCue,\n'
              '    _assign_targets,\n'
              '    _normalize_for_match,\n'
              '    _pair_score,\n'
              '    _render_preserving_layout,\n'
              ')',
          )

          old_summary = '''@dataclass(frozen=True)\nclass BpmTextRecoverySummary:\n    resolved_review_cue_count: int = 0\n    vocalization_trim_count: int = 0\n'''
          new_summary = '''@dataclass(frozen=True)\nclass BpmTextRecoverySummary:\n    resolved_review_cue_count: int = 0\n    vocalization_trim_count: int = 0\n    bounded_stream_cue_count: int = 0\n    bounded_stream_region_count: int = 0\n    bounded_stream_unmapped_cue_count: int = 0\n'''
          if old_summary not in text:
              raise SystemExit('BpmTextRecoverySummary marker not found')
          text = text.replace(old_summary, new_summary)

          old_intro = '''The implementation deliberately does not repartition whole review blocks and\ndoes not fill editor-only vocalization cues with lexical lyrics.  This keeps the\nv1.2.1 ownership/false-auto safety boundary intact while helping repeated-lyric\nsongs where unique A anchors are scarce.\n'''
          new_intro = '''Smart v1.2.3 keeps the conservative mapped 1:1 path and adds a second, bilateral\ntext-only bounded-stream path.  A ready BPM projection built only from baseline-\nsafe anchors may reconcile consecutive review/unmatched cues between two same-\nsource inlier anchors, while preserving every already-resolved cue exactly.  The\nnew path has no frontier extrapolation, refuses pure vocalization/ad-lib evidence,\nand keeps all recovered decisions below timing authority.\n'''
          if old_intro not in text:
              raise SystemExit('module intro marker not found')
          text = text.replace(old_intro, new_intro)

          helper_marker = '\ndef recover_text_reviews_from_bpm_projection(\n'
          if helper_marker not in text:
              raise SystemExit('recover function marker not found')
          helpers = r'''

_BOUNDED_STREAM_MAX_CUES = 12
_BOUNDED_STREAM_MIN_LENGTH_RATIO = 0.45
_BOUNDED_STREAM_UNMAPPED_MIN_SIMILARITY = 0.25
_BOUNDED_STREAM_SHORT_MIN_SIMILARITY = 0.80


def _decision_working_text(cue: SubtitleCue, decision: MatchDecision | None) -> str:
    if decision is not None and decision.action != "review" and decision.output_text:
        return str(decision.output_text)
    return cue.text


def _stream_canonical_spans(
    output_texts: Sequence[str],
    rows: Sequence[TimedCanonicalOccurrence],
) -> list[tuple[int, int]] | None:
    intervals: list[tuple[int, int, TimedCanonicalOccurrence]] = []
    cursor = 0
    for row in rows:
        length = len(row.normalized)
        if length <= 0:
            continue
        intervals.append((cursor, cursor + length, row))
        cursor += length
    total = cursor
    if total <= 0:
        return None

    spans: list[tuple[int, int]] = []
    cursor = 0
    for value in output_texts:
        length = len(_normalize_for_match(value))
        if length <= 0:
            return None
        start = cursor
        end = cursor + length
        hits = [row for left, right, row in intervals if right > start and left < end]
        if not hits:
            return None
        spans.append((hits[0].ordinal, hits[-1].ordinal + 1))
        cursor = end
    if cursor != total:
        return None
    return spans


def _bounded_stream_candidate(
    block_cues: Sequence[SubtitleCue],
    block_decisions: Sequence[MatchDecision],
    gap: Sequence[TimedCanonicalOccurrence],
    right_anchor: _Anchor,
    model: BpmTextProjectionModel,
    canonical_by_ordinal: Mapping[int, TimedCanonicalOccurrence],
) -> tuple[list[str], list[tuple[int, int]]] | None:
    """Return editor-boundary-preserving text for a bilateral BPM-bounded gap.

    The proof is deliberately stronger for unmapped cues than for already-mapped
    review cues: an unmapped cue needs useful lexical overlap with its assigned
    canonical text so ordinary spoken asides are not pulled into the lyric stream.
    Pure vocalization blocks the whole region rather than being filled with text.
    """

    if not block_cues or not gap or len(block_cues) > _BOUNDED_STREAM_MAX_CUES:
        return None
    if len(block_cues) != len(block_decisions):
        return None
    if any(item.action == "review" and _is_pure_vocalization(cue.text) for cue, item in zip(block_cues, block_decisions)):
        return None

    for decision in block_decisions:
        if decision.canonical_span is None:
            continue
        start, end = decision.canonical_span
        occurrences = [canonical_by_ordinal.get(value) for value in range(int(start), int(end))]
        if not occurrences or any(item is None or item.source_ordinal != model.source_ordinal for item in occurrences):
            return None

    working = [_decision_working_text(cue, decision) for cue, decision in zip(block_cues, block_decisions)]
    source_norm = "".join(_normalize_for_match(value) for value in working)
    target_text = " ".join(item.text for item in gap)
    target_norm = "".join(item.normalized for item in gap)
    if not source_norm or not target_norm:
        return None
    length_ratio = min(len(source_norm), len(target_norm)) / max(len(source_norm), len(target_norm))
    if length_ratio < _BOUNDED_STREAM_MIN_LENGTH_RATIO:
        return None

    first_start, _ = _cue_times(block_cues[0])
    _, last_end = _cue_times(block_cues[-1])
    first_predicted = model.source_to_mix_ms(gap[0].anchor_time_ms)
    last_predicted = model.source_to_mix_ms(gap[-1].anchor_time_ms)
    right_predicted = model.source_to_mix_ms(right_anchor.source_time_ms)
    if abs(right_predicted - right_anchor.mix_start_ms) > 750:
        return None
    if first_predicted < first_start - 1600 or first_predicted > first_start + 900:
        return None
    if last_predicted > last_end + 1200 or last_predicted >= right_anchor.mix_start_ms:
        return None

    assigned_content, insertion_reason = _assign_targets(working, target_text)
    if insertion_reason is not None:
        return None
    if len(assigned_content) != len(block_cues):
        return None

    rendered: list[str] = []
    for current, content in zip(working, assigned_content):
        output, _ = _render_preserving_layout(current, content)
        if not _normalize_for_match(output):
            return None
        if _normalize_for_match(output) != _normalize_for_match(content):
            return None
        rendered.append(output)
    if "".join(_normalize_for_match(value) for value in rendered) != target_norm:
        return None

    for cue, decision, current, candidate in zip(block_cues, block_decisions, working, rendered):
        current_norm = _normalize_for_match(current)
        candidate_norm = _normalize_for_match(candidate)
        if decision.action != "review":
            if current_norm != candidate_norm:
                return None
            continue
        similarity = _pair_score(cue.normalized, candidate_norm)
        if len(cue.normalized) <= 2 and similarity < _BOUNDED_STREAM_SHORT_MIN_SIMILARITY:
            return None
        if decision.canonical_span is None:
            if (
                len(cue.normalized) < 4
                or len(candidate_norm) < 4
                or similarity < _BOUNDED_STREAM_UNMAPPED_MIN_SIMILARITY
            ):
                return None

    spans = _stream_canonical_spans(rendered, gap)
    if spans is None:
        return None
    return rendered, spans


def _bounded_stream_decision(
    cue: SubtitleCue,
    original: MatchDecision,
    text: str,
    span: tuple[int, int],
) -> MatchDecision:
    return replace(
        original,
        canonical_ordinal=span[0],
        score=min(float(original.score), 0.89),
        action="unchanged" if cue.normalized == _normalize_for_match(text) else "replace",
        reason="sequence_projection_confirms_bpm_bounded_stream",
        cue_span=(cue.ordinal, cue.ordinal + 1),
        canonical_span=span,
        canonical_text=text,
        output_text=text,
        edit_operations=(),
    )
'''
          text = text.replace(helper_marker, helpers + helper_marker)

          counter_marker = '''    resolved = 0\n    trimmed = 0\n\n    for cue in cues:\n'''
          counter_replace = '''    resolved = 0\n    trimmed = 0\n    bounded_cues = 0\n    bounded_regions = 0\n    bounded_unmapped = 0\n\n    for cue in cues:\n'''
          if counter_marker not in text:
              raise SystemExit('counter marker not found')
          text = text.replace(counter_marker, counter_replace)

          stage_marker = '''    ordered = [output.get(item.cue_ordinal, item) for item in decisions]\n    return (\n'''
          bounded_stage = r'''    positions_by_source = {
        source_ordinal: {item.ordinal: index for index, item in enumerate(rows)}
        for source_ordinal, rows in lexical_rows.items()
    }
    for source_ordinal, inliers in inliers_by_source.items():
        model = ready_models.get(source_ordinal)
        rows = list(lexical_rows.get(source_ordinal, ()))
        positions = positions_by_source.get(source_ordinal, {})
        if model is None or not rows:
            continue
        anchors_for_source = sorted(inliers, key=lambda item: item.cue_ordinal)
        for left, right in zip(anchors_for_source, anchors_for_source[1:]):
            if right.cue_ordinal - left.cue_ordinal <= 1:
                continue
            block = list(cues[left.cue_ordinal + 1 : right.cue_ordinal])
            if not block or len(block) > _BOUNDED_STREAM_MAX_CUES:
                continue
            block_decisions = [output.get(cue.ordinal) for cue in block]
            if any(item is None for item in block_decisions):
                continue
            typed_decisions = [item for item in block_decisions if item is not None]
            if not any(item.action == "review" for item in typed_decisions):
                continue
            left_pos = positions.get(left.canonical_ordinal)
            right_pos = positions.get(right.canonical_ordinal)
            if left_pos is None or right_pos is None or right_pos <= left_pos + 1:
                continue
            gap = rows[left_pos + 1 : right_pos]
            candidate = _bounded_stream_candidate(
                block,
                typed_decisions,
                gap,
                right,
                model,
                canonical_by_ordinal,
            )
            if candidate is None:
                continue
            candidate_texts, candidate_spans = candidate
            region_changed = False
            region_unmapped = 0
            for cue, original, candidate_text, span in zip(
                block,
                typed_decisions,
                candidate_texts,
                candidate_spans,
            ):
                if original.action != "review":
                    continue
                if original.canonical_span is None:
                    region_unmapped += 1
                decision = _bounded_stream_decision(cue, original, candidate_text, span)
                output[cue.ordinal] = decision
                replacements[cue.ordinal] = candidate_text
                resolved += 1
                bounded_cues += 1
                region_changed = True
            if region_changed:
                bounded_regions += 1
                bounded_unmapped += region_unmapped

    ordered = [output.get(item.cue_ordinal, item) for item in decisions]
    return (
'''
          if stage_marker not in text:
              raise SystemExit('bounded stage marker not found')
          text = text.replace(stage_marker, bounded_stage)

          old_return = '''        BpmTextRecoverySummary(\n            resolved_review_cue_count=resolved,\n            vocalization_trim_count=trimmed,\n        ),\n'''
          new_return = '''        BpmTextRecoverySummary(\n            resolved_review_cue_count=resolved,\n            vocalization_trim_count=trimmed,\n            bounded_stream_cue_count=bounded_cues,\n            bounded_stream_region_count=bounded_regions,\n            bounded_stream_unmapped_cue_count=bounded_unmapped,\n        ),\n'''
          if old_return not in text:
              raise SystemExit('summary return marker not found')
          text = text.replace(old_return, new_return)
          bpm_path.write_text(text, encoding='utf-8')

          policy_path = Path('lyric_aligner/timeline/smart_policy.py')
          policy = policy_path.read_text(encoding='utf-8')
          policy = policy.replace('Smart v1.2.2 also', 'Smart v1.2.3 also')
          policy = policy.replace('smart-validation-policy-2026-08-20-v1.2.2', 'smart-validation-policy-2026-08-21-v1.2.3')
          report_marker = '''        "text_bpm_projection_vocalization_trim_count": bpm_recovery.vocalization_trim_count,\n        "text_bpm_projection_models": bpm_text_model_payload(bpm_models),\n'''
          report_replace = '''        "text_bpm_projection_vocalization_trim_count": bpm_recovery.vocalization_trim_count,\n        "text_bpm_bounded_stream_cue_count": bpm_recovery.bounded_stream_cue_count,\n        "text_bpm_bounded_stream_region_count": bpm_recovery.bounded_stream_region_count,\n        "text_bpm_bounded_stream_unmapped_recovery_count": bpm_recovery.bounded_stream_unmapped_cue_count,\n        "text_bpm_projection_models": bpm_text_model_payload(bpm_models),\n'''
          if report_marker not in policy:
              raise SystemExit('smart policy report marker not found')
          policy = policy.replace(report_marker, report_replace)
          policy_path.write_text(policy, encoding='utf-8')

          skill_path = Path('SKILL.md')
          skill = skill_path.read_text(encoding='utf-8')
          skill = skill.replace('Smart    -> Sequence Reconciliation + Anchor Timeline Repair v1.2.2', 'Smart    -> Sequence Reconciliation + Anchor Timeline Repair v1.2.3')
          skill = skill.replace('smart-validation-policy-2026-08-20-v1.2.2', 'smart-validation-policy-2026-08-21-v1.2.3')
          skill = skill.replace('Smart v1.2.2 仍然不读音频。', 'Smart v1.2.3 仍然不读音频。')
          skill = skill.replace('v1.2.2 即使使用 BPM 帮助文字 recovery', 'v1.2.3 即使使用 BPM 帮助文字 recovery')
          skill = skill.replace('Smart v1.2.2 的 `ready`', 'Smart v1.2.3 的 `ready`')
          skill = skill.replace('#### v1.2.2 BPM-validated text recovery', '#### v1.2.3 BPM-validated text recovery')
          skill = skill.replace(
              '- 只处理已经有单一 canonical occurrence claim 的 `review` cue，不靠 BPM 猜 unmapped cue，不进行整块 LRC 重分；',
              '- 先保留 v1.2.2 的 mapped 1:1 review recovery；随后允许在两个同源 baseline-safe BPM inlier anchors 之间做 bounded continuous-stream recovery；\n- bounded stream 可以处理 mapped review，也可以处理位于完整双侧强锚点之间、与分配后 canonical text 仍有最低 lexical 支持的 unmapped cue；unmapped 口播/ad-lib 不满足 lexical floor 时继续 review；\n- bounded stream 不使用 LRC 行数作为 cue 数，允许一个 canonical 行跨多个 editor cue，但所有已非 review 的 lower-mode 安全文字必须 normalized 完全不变；'
          )
          skill = skill.replace(
              '- interior candidate 必须被同源安全 anchors 夹住；歌曲前缘只允许极窄 leading-edge recovery；',
              '- mapped 1:1 interior candidate 必须被同源安全 anchors 夹住；原有歌曲前缘只允许极窄 leading-edge recovery；v1.2.3 新 bounded-stream path **只允许双侧夹住的 interior region，不做任何 frontier 外推**；'
          )
          skill = skill.replace(
              '- pure vocalization 不得被 BPM 自动填成 lexical lyric；',
              '- pure vocalization 不得被 BPM 自动填成 lexical lyric；bounded region 只要存在纯 vocalization review cue 就整体 fail closed，防止把哼唱/ad-lib 强塞成歌词；\n- bounded stream 必须通过固定 BPM projection、双侧 baseline-safe anchors、完整 canonical stream、总长度合理性、editor boundary assignment 和 non-review immutability；遇到跨 song claim、cut/frontier、boundary insertion 或低相似 unmapped cue 时 fail closed；'
          )
          skill = skill.replace(
              'text_bpm_projection_vocalization_trim_count\ntext_bpm_projection_models',
              'text_bpm_projection_vocalization_trim_count\ntext_bpm_bounded_stream_cue_count\ntext_bpm_bounded_stream_region_count\ntext_bpm_bounded_stream_unmapped_recovery_count\ntext_bpm_projection_models'
          )
          skill = skill.replace('policy_id      = smart-validation-policy-2026-08-20-v1.2.2', 'policy_id      = smart-validation-policy-2026-08-21-v1.2.3')
          skill = skill.replace('Smart policy 已升到 v1.2.2', 'Smart policy 已升到 v1.2.3')
          skill_path.write_text(skill, encoding='utf-8')

          sections = {
              Path('references/v4-change-record.md'): '''\n\n## 2026-08-21 - Smart v1.2.3 bounded BPM canonical stream recovery\n\n- Private production sampling confirmed all 12 deliberately high-risk v1.2.2 BPM auto-recoveries, including zero-lexical-similarity mapped cues.\n- Add a bilateral bounded-stream text-only path on top of the existing v1.2.2 mapped 1:1 BPM recovery.\n- The new path uses only BPM models validated by baseline-safe anchors and only regions fully bracketed by same-source inlier anchors.\n- It can recover consecutive mapped reviews and cautiously recover an unmapped interior cue only when its assigned canonical text retains minimum lexical support.\n- It preserves every already-resolved lower-mode cue normalized-exactly, allows one canonical row to span multiple editor cues, and never treats LRC row count as subtitle cue count.\n- Pure vocalization, cross-source claims, cut/frontier regions, boundary insertions, short low-information cues, and low-similarity unmapped asides remain review.\n- Recovered text remains below B timing authority and cannot create timing anchors.\n''',
              Path('references/v4-status.md'): '''\n\n## Smart v1.2.3 bounded-stream closeout\n\nSmart now has two BPM-derived text-only recovery tiers: conservative mapped 1:1 recovery and a stricter bilateral bounded-stream recovery. The latter is interior-only, requires same-source baseline-safe BPM inlier anchors on both sides, preserves all non-review lower-mode text, and fails closed on vocalization/ad-lib/cut/frontier evidence. It does not change cue count, numbering, start/end timing, primary timing authority, or the four-A timing gate.\n''',
              Path('references/v4-implementation.md'): '''\n\n### Smart v1.2.3 BPM bounded canonical stream\n\n`timeline/bpm_sequence_reconcile.py` may now consume a complete lexical canonical gap between adjacent same-source BPM inlier anchors and repartition that stream across the existing editor cues. `_assign_targets` is used only inside a region that has passed BPM projection, bilateral-anchor, source-consistency, length, vocalization/ad-lib, boundary-insertion, short-cue, unmapped lexical-floor, and lower-mode immutability guards. Canonical row boundaries remain non-authoritative: one canonical row may intersect more than one editor cue. The resulting decisions use `sequence_projection_confirms_bpm_bounded_stream`, remain C-grade/below B timing authority, and cannot feed timing model construction.\n''',
          }
          for path, section in sections.items():
              content = path.read_text(encoding='utf-8')
              marker = section.strip().splitlines()[0]
              if marker not in content:
                  path.write_text(content.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-smart-v123-bounded-stream.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lyric_aligner/timeline/bpm_sequence_reconcile.py lyric_aligner/timeline/smart_policy.py scripts/test_v4_smart_bpm_bounded_stream_v123.py SKILL.md references/v4-change-record.md references/v4-status.md references/v4-implementation.md .github/workflows/temp-smart-v123-bounded-stream.yml
          git commit -m "smart: add bounded BPM stream recovery v1.2.3"
          git push origin HEAD:${{ github.head_ref }}
