name: agent-smart-v124-acceptance-docsync

on:
  push:
    branches:
      - agent/smart-v124-acceptance-fix-20260821

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-v124-acceptance-fix-20260821
          fetch-depth: 0
      - name: Append acceptance correction
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "Smart v1.2.4 production-acceptance ownership correction"
          sections = {
              "references/v4-change-record.md": f'''\n\n## 2026-08-21 - {marker}\n\n最终 578-cue acceptance 在 #56 maintenance 后发现一个真实回归：ownership duplicate-drop 若被限制为 Sequence-only，会重新暴露 Text Repair 已安全识别的边界短语重复。该问题来自权限收得过窄，不是新增恢复需求。\n\n- boundary move 继续只允许至少一侧为 `sequence_projection_confirms_*`；\n- duplicate-drop 允许作用于至少一侧 `action=replace` 或 Sequence-related 的 pair，用于删除本轮 text pipeline 实际制造的 2–6 字短重复；\n- 两侧都未发生 mutation 的 untouched/review pair 不获得删除权限；\n- 原 editor ownership、score improvement、非空 cue、2–6 字 bounded removal 等既有 guard 保持；\n- 不改变 policy id/schema、BPM/Text Repair 阈值、cue/timing authority，也不新增 recovery tier。\n''',
              "references/v4-status.md": f'''\n\n### {marker}\n\n最终生产 acceptance 修正 #56 中过窄的 ownership scope：普通 boundary move 仍为 Sequence-only；duplicate-drop 则要求至少一侧确实由当前 text pipeline `replace`（或 Sequence-related），因此可继续消除 Text Repair/BPM/Sequence 实际制造且由原 editor ownership 证明的短重复。纯 untouched pair 仍 fail closed。该修正恢复既有安全结果，不新增 Smart 能力。\n''',
              "references/v4-implementation.md": f'''\n\n### {marker}\n\n`ownership_guard` 的两类 mutation 权限分开：`boundary_move` 只在 `_eligible_pair()`（至少一侧 Sequence-related）下运行；`duplicate_drop` 使用更窄的 mutation-evidence gate，要求至少一侧 `MatchDecision.action == replace` 或 Sequence-related。这样 Text Repair/BPM/Sequence 已经实际改字并在边界制造同一 2–6 字副本时，guard 仍可依据原 editor ownership 删除重复；若两侧 decision 都表示 untouched/review，则 replacement map 本身不能单独授权删除。\n''',
          }
          for name, addition in sections.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY
      - name: Remove temporary workflow and push docs
        run: |
          rm .github/workflows/agent-smart-v124-acceptance-docsync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/v4-change-record.md references/v4-status.md references/v4-implementation.md .github/workflows/agent-smart-v124-acceptance-docsync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record Smart acceptance ownership correction"
          git push origin HEAD:agent/smart-v124-acceptance-fix-20260821
