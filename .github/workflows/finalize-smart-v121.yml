name: finalize-smart-v121

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/smart-v121-clean' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Append owning documentation
        shell: python
        run: |
          from pathlib import Path

          additions = {
              "references/v4-change-record.md": """

## 2026-08-20 — Smart v1.2.1 editor cue ownership guard

真实剪映回归发现：canonical 文字已经修正时，line-LRC 分句差异仍可能让 Sequence 层把可识别短语跨相邻 cue 搬移，或把同一边界短语重复到前后两个 cue。v1.2.1 新增 `timeline/ownership_guard.py` 作为最终 text materialization 前的保守 guard：只允许把 2–6 个已由原 editor 识别证明归属的边界字符搬回原 cue；普通边界移动必须保持相邻 cue 合并后的 canonical 文字流完全不变；仅在明确重复副本位于边界两侧时允许删除一份短重复。guard 不改变 cue 数、编号或 timing，也不产生 A/B timing anchor。
""",
              "references/v4-status.md": """

### Smart v1.2.1 ownership closeout

Smart final text materialization 现在增加 editor cue ownership guard。canonical 继续拥有文字/顺序权威，但 line-LRC 行边界不能单独把原 editor 已识别的短语跨 cue 搬移。该 guard 只修复 sequence/text-repair 已产生的局部边界搬移或短重复，不扩大 canonical recovery 范围，不改变时间轴，不提升 timing authority。
""",
              "references/v4-implementation.md": """

### Smart v1.2.1 — final editor ownership guard

`timeline/ownership_guard.py` 位于 Sequence Projection 之后、SRT text materialization 之前。输入是原 editor cues、当前 text decisions 与 replacements。它只检查相邻 cue 边界：若原 editor 可识别文本能证明 2–6 字短语属于另一侧，而当前 sequence 结果把该短语搬错，则可在相邻 cue 之间搬回；若同一短语被重复到边界两侧，则只允许删除一份已证明的短重复副本。普通搬移必须保持 pair-combined normalized lyric stream 完全不变。输出 decision 固定低于 B-grade，并清除 canonical span 以阻止其成为 timing anchor。
""",
              "SKILL.md": """

### Smart v1.2.1 editor cue ownership guard

当前 Smart policy 为 `smart-validation-policy-2026-08-20-v1.2.1`。Canonical 继续拥有最终歌词文字与顺序，但可识别的 Jianying 原始文本同时提供 cue ownership 证据：line-LRC 分句不能单独把已识别的 2–6 字边界短语跨 cue 搬移，也不能把同一短语重复到相邻两个 cue。最终 ownership guard 只修复这种局部边界搬移/短重复，不改变 cue 数、编号、start/end，不扩大 canonical recovery，也不能产生 A/B timing anchor。
""",
          }
          for name, addition in additions.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              marker = addition.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
      - name: Targeted regressions
        run: |
          PYTHONPATH=. python scripts/test_v4_smart_ownership_guard.py
          PYTHONPATH=. python scripts/test_v4_smart_sequence_reconcile.py
          PYTHONPATH=. python scripts/test_v4_smart_sequence_frontier_guard.py
          PYTHONPATH=. python scripts/test_v4_smart_pro_v111_regressions.py
          python -m compileall -q lyric_aligner scripts
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/finalize-smart-v121.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize Smart v1.2.1 ownership guard"
          git push origin HEAD:${{ github.head_ref }}
