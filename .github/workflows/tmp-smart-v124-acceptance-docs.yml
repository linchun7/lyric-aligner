name: tmp-smart-v124-acceptance-docs

on:
  push:
    branches:
      - agent/smart-v124-acceptance-regression-fix-20260821

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-v124-acceptance-regression-fix-20260821
      - name: Update owning docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              Path('references/v4-change-record.md'): '''\n\n## 2026-08-21 - Smart v1.2.4 final-acceptance ownership regression fix\n\nFinal 578-cue acceptance of the maintenance-only #56 change exposed an over-tight ownership scope. Boundary movement remains Sequence-only, but duplicate-drop must also repair a short boundary duplicate when an existing upstream `replace` decision itself materialized the changed text and the original editor recognition proves ownership on the other side. The guard now requires the current changed text to normalized-match that decision's own `output_text`; arbitrary baseline text cannot activate the path. This restores the established Text Repair duplicate cleanup without adding a new recovery tier, changing timing authority, or relaxing any text/BPM threshold. Public regression uses synthetic text only.\n''',
              Path('references/v4-status.md'): '''\n\n### Smart v1.2.4 final acceptance ownership correction\n\nFinal production acceptance refined the #56 ownership scope: ordinary boundary moves remain limited to pairs with Sequence reconciliation evidence. Duplicate-drop additionally permits an already-existing upstream `replace` decision (Text Repair or another existing Smart text layer) to justify cleanup only when the working changed text exactly matches that decision's `output_text` and the original editor boundary proves the duplicate belongs to the opposite side. A fabricated/unproven working replacement remains fail-closed. This is a regression fix to preserve established output, not a new Smart capability or authority increase.\n''',
              Path('references/v4-implementation.md'): '''\n\n### Smart v1.2.4 final-acceptance ownership invariant\n\n`ownership_guard` has two distinct permissions. `boundary_move` remains Sequence-reconciliation-only. `duplicate_drop` may run for a Sequence pair **or** when at least one adjacent cue has a materialized upstream `replace` whose normalized `output_text` exactly equals the current working text and differs from the original editor cue. The duplicate must still be 2-6 normalized characters, be present on both sides, be assigned to only one side by the original editor recognition, improve pair similarity, and leave both cues non-empty. This keeps the guard from acting as a free-standing baseline editor while preserving Text Repair duplicates that the guard historically removed.\n''',
          }
          for path, text in updates.items():
              current = path.read_text(encoding='utf-8')
              marker = text.strip().splitlines()[0]
              if marker not in current:
                  path.write_text(current.rstrip() + text + '\n', encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit docs
        shell: bash
        run: |
          rm .github/workflows/tmp-smart-v124-acceptance-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add references/v4-change-record.md references/v4-status.md references/v4-implementation.md .github/workflows/tmp-smart-v124-acceptance-docs.yml
          git commit -m "docs: record Smart v1.2.4 acceptance ownership fix"
          git push origin HEAD:agent/smart-v124-acceptance-regression-fix-20260821
