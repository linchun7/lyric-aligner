name: agent-pro-v113-shadow-budget

on:
  push:
    branches:
      - agent/pro-v113-shadow-budget-20260821

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pro-v113-shadow-budget-20260821
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded planner fix and synthetic regression
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('lyric_aligner/alignment/selective_policy.py')
          text = policy.read_text(encoding='utf-8')
          replacements = {
              'PRO_V11_POLICY_ID = "smart-to-pro-reason-aware-2026-08-21-v1.1.2"':
                  'PRO_V11_POLICY_ID = "smart-to-pro-reason-aware-2026-08-21-v1.1.3"',
              '    """Build the reason-aware Pro v1.1.2 plan from the current Smart policy only."""':
                  '    """Build the reason-aware Pro v1.1.3 plan from the current Smart policy only."""',
              '''    competitor_slots = max(0, config.max_jobs - len(primary_jobs))\n    competitors = eligible_competitors[:competitor_slots]\n    omitted_competitors = len(eligible_competitors) - len(competitors)\n''':
                  '''    # Shadow competitors are companion evidence for already-selected primary\n    # boundary cues. They must not consume or displace the primary unresolved\n    # cue budget; otherwise a fully-used max_jobs budget silently drops the\n    # dual-source check exactly where identity is most ambiguous.\n    competitors = eligible_competitors\n    omitted_competitors = 0\n''',
              '        "max_jobs_applies_to": "reason_aware_selected_jobs_including_shadow_competitors",':
                  '        "max_jobs_applies_to": "primary_jobs_only_shadow_competitors_additive",',
              '        "plan_truncated": bool(primary_truncated or omitted_competitors),':
                  '        "plan_truncated": bool(primary_truncated),',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected policy patch match count for {old[:80]!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          policy.write_text(text, encoding='utf-8')

          test = Path('scripts/test_v4_pro_shadow_budget_v113.py')
          test.write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom lyric_aligner.alignment.selective_policy import (\n    PRO_V11_POLICY_ID,\n    build_selective_repair_plan_v11,\n)\nfrom lyric_aligner.alignment.selective_repair import SelectiveRepairConfig\nfrom lyric_aligner.text_repair import SubtitleCue\nfrom lyric_aligner.timeline.anchor_repair import TimedCanonicalOccurrence\nfrom lyric_aligner.timeline.smart_policy import SMART_POLICY_ID, SMART_SCHEMA_VERSION\n\n\ndef _cue(ordinal: int, start_ms: int, end_ms: int, text: str) -> SubtitleCue:\n    def clock(ms: int) -> str:\n        hour, rem = divmod(ms, 3_600_000)\n        minute, rem = divmod(rem, 60_000)\n        second, millis = divmod(rem, 1000)\n        return f"{hour:02d}:{minute:02d}:{second:02d},{millis:03d}"\n\n    return SubtitleCue(\n        ordinal=ordinal,\n        number=str(ordinal + 1),\n        timing=f"{clock(start_ms)} --> {clock(end_ms)}",\n        text=text,\n        normalized=text,\n        raw_block_index=ordinal * 2,\n    )\n\n\ndef _canonical(ordinal: int, source_ordinal: int, time_ms: int, text: str):\n    return TimedCanonicalOccurrence(\n        ordinal=ordinal,\n        source=f"{source_ordinal + 1:02d}.lrc",\n        source_ordinal=source_ordinal,\n        time_ms=time_ms,\n        text=text,\n        normalized=text,\n    )\n\n\nclass ProShadowBudgetV113Tests(unittest.TestCase):\n    def test_shadow_competitor_is_additive_to_primary_budget(self) -> None:\n        cues = [_cue(0, 10_000, 11_000, "末句")]\n        canonical = [\n            _canonical(0, 0, 1_000, "甲"),\n            _canonical(1, 0, 5_000, "乙"),\n            _canonical(2, 0, 9_000, "末句"),\n            _canonical(3, 1, 1_000, "下一首首句"),\n            _canonical(4, 1, 5_000, "下一首次句"),\n        ]\n        report = {\n            "schema_version": SMART_SCHEMA_VERSION,\n            "policy_id": SMART_POLICY_ID,\n            "mode": "smart_anchor_timeline_repair_no_audio",\n            "audio_read": False,\n            "models": [\n                {"source_ordinal": 0, "source": "01.lrc", "rate": 1.0, "status": "ready"},\n                {"source_ordinal": 1, "source": "02.lrc", "rate": 1.0, "status": "ready"},\n            ],\n            "timing_decisions": [\n                {\n                    "cue_ordinal": 0,\n                    "canonical_ordinal": 2,\n                    "action": "review",\n                    "reason": "unresolved_timing_model_not_ready",\n                    "proposed_start_ms": None,\n                    "proposed_end_ms": None,\n                }\n            ],\n            "text_decisions": [\n                {"cue_ordinal": 0, "canonical_ordinal": 2, "action": "unchanged"}\n            ],\n        }\n\n        plan = build_selective_repair_plan_v11(\n            smart_report=report,\n            cues=cues,\n            canonical=canonical,\n            config=SelectiveRepairConfig(max_jobs=1),\n        )\n\n        primary = [job for job in plan["jobs"] if not job.get("shadow_evidence_only")]\n        shadow = [job for job in plan["jobs"] if job.get("shadow_evidence_only")]\n        self.assertEqual(PRO_V11_POLICY_ID, "smart-to-pro-reason-aware-2026-08-21-v1.1.3")\n        self.assertEqual(len(primary), 1)\n        self.assertEqual(len(shadow), 1)\n        self.assertEqual(plan["summary"]["job_count"], 2)\n        self.assertEqual(plan["summary"]["primary_job_count"], 1)\n        self.assertEqual(plan["summary"]["boundary_competitor_job_count"], 1)\n        self.assertEqual(plan["summary"]["boundary_competitor_omitted_due_to_max_jobs"], 0)\n        self.assertEqual(\n            plan["summary"]["max_jobs_applies_to"],\n            "primary_jobs_only_shadow_competitors_additive",\n        )\n        self.assertEqual(shadow[0]["boundary_competitor_for_job_id"], primary[0]["job_id"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          docs = {
              'references/v4-change-record.md': '''\n\n### 2026-08-21 — Pro v1.1.3 shadow evidence budget semantics\n\n- `max_jobs` now limits selected primary unresolved cues only.\n- A song-boundary dual-source competitor is additive shadow evidence for an already-selected primary cue and cannot displace that primary cue or disappear merely because the primary budget is full.\n- No acoustic, ASR, forced-alignment threshold, Smart behavior, or timing-mutation authority changed.\n''',
              'references/v4-status.md': '''\n\n### Pro v1.1.3 selective budget status\n\nPro uses `max_jobs` as a primary unresolved-cue budget. Boundary competitor jobs are companion shadow evidence attached only to selected primary jobs and are additive to that budget; they never introduce additional primary repair candidates.\n''',
              'references/v4-implementation.md': '''\n\n### Pro v1.1.3 primary budget vs. shadow evidence\n\nThe reason-aware selector first chooses primary unresolved cues under `max_jobs`. Only after that selection, `_boundary_competitor()` may add a dual-source shadow job for a selected primary near a source boundary. Shadow jobs do not consume the primary budget, cannot select new unresolved cues, and retain evidence-only/no-timing-mutation semantics.\n''',
          }
          for name, appendix in docs.items():
              path = Path(name)
              current = path.read_text(encoding='utf-8')
              if appendix.strip() not in current:
                  path.write_text(current.rstrip() + appendix + '\n', encoding='utf-8')
          PY
          rm .github/workflows/agent-pro-v113-shadow-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lyric_aligner/alignment/selective_policy.py scripts/test_v4_pro_shadow_budget_v113.py references/v4-change-record.md references/v4-status.md references/v4-implementation.md .github/workflows/agent-pro-v113-shadow-budget.yml
          git commit -m "fix: keep Pro shadow evidence outside primary budget"
          git push origin HEAD:agent/pro-v113-shadow-budget-20260821