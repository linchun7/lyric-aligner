name: agent-pro-v113-update-legacy-regression

on:
  push:
    branches:
      - agent/pro-v113-shadow-budget-20260821

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pro-v113-shadow-budget-20260821
      - name: Update legacy regression to v1.1.3 budget semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_v4_smart_pro_v111_regressions.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_max_jobs_caps_shadow_competitors_too(self) -> None:\n        cues = [\n            _cue(0, 10_000, 11_000, "尾句"),\n            _cue(1, 20_000, 21_000, "第二条"),\n        ]\n        canonical = [\n            _canonical(0, 0, 1_000, "前句"),\n            _canonical(1, 0, 5_000, "尾句"),\n            _canonical(2, 1, 1_000, "第二条"),\n            _canonical(3, 1, 5_000, "后句"),\n        ]\n        report = _smart_report(\n            timing_decisions=[\n                {\n                    "cue_ordinal": 0,\n                    "canonical_ordinal": 1,\n                    "action": "review",\n                    "reason": "unresolved_timing_model_not_ready",\n                },\n                {\n                    "cue_ordinal": 1,\n                    "canonical_ordinal": 2,\n                    "action": "review",\n                    "reason": "unresolved_timing_model_not_ready",\n                },\n            ],\n            text_decisions=[\n                {"cue_ordinal": 0, "canonical_ordinal": 1, "action": "unchanged"},\n                {"cue_ordinal": 1, "canonical_ordinal": 2, "action": "unchanged"},\n            ],\n        )\n\n        plan = build_selective_repair_plan_v11(\n            smart_report=report,\n            cues=cues,\n            canonical=canonical,\n            config=SelectiveRepairConfig(max_jobs=2),\n        )\n\n        self.assertLessEqual(len(plan["jobs"]), 2)\n        self.assertEqual(plan["summary"]["job_count"], len(plan["jobs"]))\n        self.assertGreaterEqual(\n            plan["summary"]["boundary_competitor_omitted_due_to_max_jobs"], 1\n        )\n'''
          new = '''    def test_max_jobs_caps_primary_while_shadow_competitors_are_additive(self) -> None:\n        cues = [\n            _cue(0, 10_000, 11_000, "尾句"),\n            _cue(1, 20_000, 21_000, "第二条"),\n        ]\n        canonical = [\n            _canonical(0, 0, 1_000, "前句"),\n            _canonical(1, 0, 5_000, "尾句"),\n            _canonical(2, 1, 1_000, "第二条"),\n            _canonical(3, 1, 5_000, "后句"),\n        ]\n        report = _smart_report(\n            timing_decisions=[\n                {\n                    "cue_ordinal": 0,\n                    "canonical_ordinal": 1,\n                    "action": "review",\n                    "reason": "unresolved_timing_model_not_ready",\n                },\n                {\n                    "cue_ordinal": 1,\n                    "canonical_ordinal": 2,\n                    "action": "review",\n                    "reason": "unresolved_timing_model_not_ready",\n                },\n            ],\n            text_decisions=[\n                {"cue_ordinal": 0, "canonical_ordinal": 1, "action": "unchanged"},\n                {"cue_ordinal": 1, "canonical_ordinal": 2, "action": "unchanged"},\n            ],\n        )\n\n        plan = build_selective_repair_plan_v11(\n            smart_report=report,\n            cues=cues,\n            canonical=canonical,\n            config=SelectiveRepairConfig(max_jobs=2),\n        )\n\n        primary = [row for row in plan["jobs"] if not row.get("shadow_evidence_only")]\n        shadow = [row for row in plan["jobs"] if row.get("shadow_evidence_only")]\n        primary_ids = {row["job_id"] for row in primary}\n        self.assertEqual(len(primary), 2)\n        self.assertGreaterEqual(len(shadow), 1)\n        self.assertEqual(plan["summary"]["job_count"], len(plan["jobs"]))\n        self.assertEqual(plan["summary"]["boundary_competitor_omitted_due_to_max_jobs"], 0)\n        self.assertEqual(\n            plan["summary"]["max_jobs_applies_to"],\n            "primary_jobs_only_shadow_competitors_additive",\n        )\n        self.assertTrue(\n            all(row["boundary_competitor_for_job_id"] in primary_ids for row in shadow)\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected legacy regression match count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/agent-pro-v113-update-legacy-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/test_v4_smart_pro_v111_regressions.py .github/workflows/agent-pro-v113-update-legacy-regression.yml
          git commit -m "test: align Pro shadow budget regression with v1.1.3"
          git push origin HEAD:agent/pro-v113-shadow-budget-20260821