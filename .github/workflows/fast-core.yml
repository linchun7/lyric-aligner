name: fast-core

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q lyric_aligner scripts
      - name: Validate documentation contract
        shell: bash
        run: python scripts/validate_docs_contract.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/validate_skill.py .
      - run: python scripts/privacy_scan.py
      - run: git diff --check
